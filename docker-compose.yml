version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: colortek_admin
      POSTGRES_PASSWORD: colortek_password
      POSTGRES_DB: colortek_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./colortek_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://colortek_admin:colortek_password@db:5432/colortek_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://frontend:80
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./colortek-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemical Archive ? Research & Compound Library</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --paper-primary: #FAE8B4;
      --paper-surface: #F6E2A3;
      --paper-card: #FDF7E3;
      --paper-card-hover: #FFFDF5;
      --archival-beige: #CBBD93;
      --archival-beige-light: #DDD1AA;
      --archival-beige-dark: #B5A57A;
      --olive-muted: #80775C;
      --olive-light: #9C9274;
      --olive-faint: rgba(128, 119, 92, 0.16);
      --ink-primary: #574A24;
      --ink-dark: #382F15;
      --ink-subtle: rgba(87, 74, 36, 0.08);
      --ink-border: rgba(87, 74, 36, 0.28);
      --border-subtle: rgba(128, 119, 92, 0.24);

      --font-display: 'Cinzel', Georgia, serif;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Mono', monospace;

      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;
      --sidebar-width: 300px; --header-height: 80px;
      --radius-sm: 2px;
      --ease-archival: cubic-bezier(0.2, 0.9, 0.3, 1);
      --duration-snappy: 200ms; --duration-smooth: 320ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
      background-color: var(--paper-primary);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    ::selection { background: var(--archival-beige); color: var(--ink-dark); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--paper-primary); }
    ::-webkit-scrollbar-thumb { background: var(--archival-beige-dark); border-radius: 2px; }

    .archive-header {
      height: var(--header-height);
      background-color: var(--paper-primary);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--sp-8);
      position: sticky;
      top: 0;
      z-index: 60;
    }
    .header-left { display: flex; align-items: center; gap: var(--sp-6); }
    .brand-group { display: flex; align-items: center; gap: var(--sp-4); text-decoration: none; color: inherit; cursor: pointer; }
    .brand-mark {
      width: 44px; height: 44px; border: 1px solid var(--ink-primary); background: var(--paper-surface);
      display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
    }
    .brand-mark::after { content: ''; position: absolute; inset: 2px; border: 1px dashed var(--olive-muted); opacity: 0.5; }
    .brand-mark span { font-family: var(--font-display); font-size: 13px; font-weight: 800; color: var(--ink-primary); }
    .brand-text h1 { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 2.2px; line-height: 1.15; color: var(--ink-primary); text-transform: uppercase; }
    .brand-text p { font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--olive-muted); letter-spacing: 0.4px; }

    .header-center { flex: 1; max-width: 540px; margin: 0 var(--sp-8); }
    .search-container { position: relative; width: 100%; }
    .search-container i.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--olive-muted); width: 16px; height: 16px; pointer-events: none; }
    .search-input {
      width: 100%; height: 42px; background-color: var(--paper-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      padding: 0 42px 0 42px; font-family: var(--font-sans); font-size: 13px; color: var(--ink-primary); transition: all var(--duration-snappy) var(--ease-archival);
    }
    .search-input:focus { outline: none; border-color: var(--ink-primary); background-color: #FFFDF7; box-shadow: 0 2px 10px rgba(87, 74, 36, 0.08); }
    .search-clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--olive-muted); cursor: pointer; display: none; padding: 4px; }
    .search-clear-btn:hover { color: var(--ink-primary); }

    .app-container { display: flex; flex: 1; position: relative; }
    .archive-sidebar {
      width: var(--sidebar-width); background-color: var(--archival-beige); border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: var(--header-height);
      height: calc(100vh - var(--header-height)); overflow-y: auto; padding: var(--sp-6) 0; z-index: 40;
    }
    .sidebar-heading {
      font-family: var(--font-sans); font-size: 10.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--olive-muted); padding: 0 var(--sp-6) var(--sp-3) var(--sp-6); display: flex; align-items: center; justify-content: space-between;
    }
    .collection-nav { list-style: none; display: flex; flex-direction: column; gap: 4px; padding: 0 var(--sp-3); }
    .collection-btn {
      width: 100%; background: transparent; border: 1px solid transparent; padding: 12px 14px; text-align: left; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-sm);
      transition: all var(--duration-snappy) var(--ease-archival); position: relative; color: var(--ink-primary);
    }
    .collection-btn::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 0;
      background-color: var(--ink-primary); transition: height var(--duration-snappy) var(--ease-archival);
    }
    .collection-btn:hover { background-color: rgba(250, 232, 180, 0.6); padding-left: 18px; }
    .collection-btn.active { background-color: var(--paper-primary); border-color: var(--ink-primary); box-shadow: 0 2px 6px rgba(87, 74, 36, 0.12); padding-left: 18px; }
    .collection-btn.active::before { height: 75%; }
    .coll-info { display: flex; flex-direction: column; gap: 2px; }
    .coll-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.8px; color: var(--ink-primary); }
    .coll-range { font-family: var(--font-mono); font-size: 11px; color: var(--olive-muted); letter-spacing: 0.4px; }
    .coll-count {
      font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--olive-muted); background: rgba(128, 119, 92, 0.14);
      padding: 3px 8px; border-radius: 2px; border: 1px solid rgba(128, 119, 92, 0.2);
    }
    .collection-btn.active .coll-count { background: var(--ink-primary); color: var(--paper-primary); border-color: var(--ink-dark); }

    .archive-main { flex: 1; padding: var(--sp-8); max-width: 1440px; margin: 0 auto; width: 100%; min-height: calc(100vh - var(--header-height)); }
    .catalog-title-strip { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--sp-4); margin-bottom: var(--sp-6); }
    .catalog-title-left h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--ink-primary); }
    .catalog-sub-count { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--olive-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .catalog-sub-count span.dot { width: 4px; height: 4px; background-color: var(--olive-muted); border-radius: 50%; }

    .library-index-tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--sp-6); padding-bottom: 1px; }
    .index-tab-btn {
      background: var(--archival-beige); border: 1px solid var(--border-subtle); border-bottom: none; padding: 8px 18px;
      font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--olive-muted);
      cursor: pointer; border-radius: 4px 4px 0 0; position: relative; bottom: -1px; transition: all var(--duration-snappy) ease; white-space: nowrap;
    }
    .index-tab-btn:hover { background: var(--archival-beige-light); color: var(--ink-primary); }
    .index-tab-btn.active {
      background: var(--paper-primary); color: var(--ink-primary); border-color: var(--border-subtle); border-bottom: 1px solid var(--paper-primary);
      box-shadow: 0 -2px 5px rgba(87, 74, 36, 0.06); transform: translateY(-2px);
    }

    .active-filter-strip { display: flex; align-items: center; gap: 8px; margin-bottom: var(--sp-6); flex-wrap: wrap; }
    .filter-chip { background: var(--paper-surface); border: 1px solid var(--border-subtle); padding: 4px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-primary); display: flex; align-items: center; gap: 8px; border-radius: var(--radius-sm); }
    .filter-chip button { background: none; border: none; color: var(--olive-muted); cursor: pointer; display: flex; align-items: center; }
    .filter-chip button:hover { color: var(--ink-primary); }

    .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--sp-6); }
    .catalog-card {
      background-color: var(--paper-card); border: 1px solid var(--border-subtle); padding: var(--sp-6); border-radius: var(--radius-sm);
      display: flex; flex-direction: column; justify-content: space-between; min-height: 260px; cursor: pointer; position: relative;
      box-shadow: 0 1px 3px rgba(87, 74, 36, 0.05); transition: transform var(--duration-smooth) var(--ease-archival), box-shadow var(--duration-smooth) var(--ease-archival), border-color var(--duration-smooth) var(--ease-archival), background-color var(--duration-smooth) var(--ease-archival);
    }
    .catalog-card::before { content: ''; position: absolute; bottom: 12px; left: 12px; width: 8px; height: 8px; border-radius: 50%; background-color: var(--paper-primary); border: 1px solid var(--border-subtle); opacity: 0.6; }
    .catalog-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(87, 74, 36, 0.14); border-color: var(--ink-border); background-color: var(--paper-card-hover); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--sp-3); }
    .card-call-number { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink-primary); border-bottom: 2px solid var(--ink-primary); padding-bottom: 2px; }
    .card-archival-stamp { font-family: var(--font-mono); font-size: 10px; color: var(--olive-muted); border: 1px solid var(--olive-faint); padding: 1px 6px; border-radius: var(--radius-sm); }
    .card-product-name { font-family: var(--font-serif); font-size: 18px; font-weight: 600; line-height: 1.25; color: var(--ink-primary); margin-bottom: var(--sp-3); }
    .card-divider { height: 1px; background-color: var(--border-subtle); margin: var(--sp-3) 0; opacity: 0.6; }
    .card-meta-section { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--sp-3); }
    .card-category-label { font-family: var(--font-sans); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--olive-muted); }
    .card-category-value { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--ink-primary); }
    .card-desc-label { font-family: var(--font-sans); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--olive-muted); margin-bottom: 2px; }
    .card-desc-text { font-family: var(--font-serif); font-size: 13.5px; line-height: 1.45; color: var(--olive-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: flex-end; padding-top: var(--sp-3); border-top: 1px dashed rgba(128, 119, 92, 0.3); margin-top: auto; }
    .card-view-link { font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--olive-muted); display: inline-flex; align-items: center; gap: 6px; }
    .catalog-card:hover .card-view-link { color: var(--ink-primary); transform: translateX(3px); }

    .pagination-bar {
      margin-top: var(--sp-8); display: flex; align-items: center; justify-content: space-between;
      background: var(--paper-surface); border: 1px solid var(--border-subtle); padding: var(--sp-4) var(--sp-6);
      border-radius: var(--radius-sm); flex-wrap: wrap; gap: 12px;
    }
    .pagination-info { font-family: var(--font-mono); font-size: 12px; color: var(--ink-primary); }
    .pagination-buttons { display: flex; align-items: center; gap: 6px; }
    .btn-page {
      background: var(--archival-beige); border: 1px solid var(--border-subtle); padding: 6px 12px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink-primary); cursor: pointer; border-radius: 2px; transition: all 150ms ease;
    }
    .btn-page:hover:not(:disabled) { background: var(--paper-primary); border-color: var(--ink-primary); }
    .btn-page.active { background: var(--ink-primary); color: var(--paper-primary); border-color: var(--ink-dark); }
    .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }

    .dossier-overlay { position: fixed; inset: 0; background: rgba(87, 74, 36, 0.45); backdrop-filter: blur(2px); z-index: 100; display: flex; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity var(--duration-smooth) var(--ease-archival); }
    .dossier-overlay.open { opacity: 1; pointer-events: auto; }
    .dossier-panel { width: 760px; max-width: 95vw; height: 100vh; background-color: var(--paper-primary); border-left: 2px solid var(--ink-primary); box-shadow: -10px 0 35px rgba(56, 47, 21, 0.35); display: flex; flex-direction: column; transform: translateX(100%); transition: transform var(--duration-smooth) var(--ease-archival); overflow-y: auto; }
    .dossier-overlay.open .dossier-panel { transform: translateX(0); }
    .dossier-header { padding: var(--sp-6) var(--sp-8); background-color: var(--archival-beige); border-bottom: 1px solid var(--ink-border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .btn-back-link { background: none; border: none; font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-primary); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-dossier-nav { background: var(--paper-primary); border: 1px solid var(--border-subtle); color: var(--ink-primary); padding: 6px 12px; font-size: 11px; font-weight: 700; font-family: var(--font-sans); cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 4px; }
    .dossier-body { padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-6); }
    .dossier-callout-code { font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: 2px; color: var(--ink-primary); border-bottom: 3px double var(--ink-primary); padding-bottom: 6px; display: inline-block; }
    .dossier-product-title { font-family: var(--font-serif); font-size: 28px; font-weight: 700; color: var(--ink-dark); line-height: 1.2; margin-top: var(--sp-2); }
    .chem-vector-box { background: var(--paper-card); border: 1px solid var(--border-subtle); padding: var(--sp-4); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
    .chem-vector-box svg { max-width: 180px; max-height: 120px; }
    .dossier-grid-meta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); background: var(--paper-surface); padding: var(--sp-6); border: 1px solid var(--border-subtle); }
    .dossier-meta-item label { font-family: var(--font-sans); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--olive-muted); display: block; margin-bottom: 2px; }
    .dossier-meta-item span { font-family: var(--font-mono); font-size: 13px; color: var(--ink-primary); font-weight: 600; }
    .dossier-desc-text { font-family: var(--font-serif); font-size: 16px; line-height: 1.6; color: var(--ink-primary); text-align: justify; }

    .btn-cancel { background: none; border: 1px solid var(--border-subtle); padding: 8px 16px; font-size: 11px; font-weight: 700; font-family: var(--font-sans); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; color: var(--olive-muted); border-radius: var(--radius-sm); }
    .btn-cancel:hover { background: var(--archival-beige); color: var(--ink-primary); }

    @media print {
      body * { visibility: hidden; }
      #dossierPanel, #dossierPanel * { visibility: visible; }
      #dossierPanel { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; box-shadow: none; background: #FFF; }
      .dossier-header, .btn-dossier-nav, .btn-back-link { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="archive-header">
    <div class="header-left">
      <div class="brand-group" onclick="selectCollection('ALL')">
        <div class="brand-mark"><span>CA</span></div>
        <div class="brand-text">
          <h1>Chemical Archive</h1>
          <p>Research & Compound Library</p>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="header-center">
      <div class="search-container">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search exact code (e.g. D-250, Tc-1000), name, category..." />
        <button id="searchClearBtn" class="search-clear-btn"><i data-lucide="x"></i></button>
      </div>
    </div>

    <div class="header-right">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--olive-muted); letter-spacing:0.5px;">
        3,381 CATALOGED SPECIMENS
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="app-container">

    <!-- Left Sidebar: Complete Collection Index -->
    <aside class="archive-sidebar">
      <div class="sidebar-heading">
        <span>Collection Index</span>
        <i data-lucide="archive" style="width:13px; height:13px;"></i>
      </div>
      <ul class="collection-nav" id="collectionNavList"></ul>
    </aside>

    <!-- Main Public Library View -->
    <main class="archive-main">
      <div class="catalog-title-strip">
        <div class="catalog-title-left">
          <h2 id="currentCollectionTitle">ALL RECORDS</h2>
          <div class="catalog-sub-count">
            <span id="recordCountLabel">3,381 CATALOGED CHEMICAL RECORDS</span>
            <span class="dot"></span>
            <span>NIST VERIFIED ARCHIVE</span>
          </div>
        </div>

        <div class="catalog-controls-right">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-family:var(--font-sans); font-size:10px; font-weight:700; text-transform:uppercase; color:var(--olive-muted);">Sort:</span>
            <select class="form-select" id="sortSelect" style="background:var(--paper-surface); border:1px solid var(--border-subtle); padding:6px 12px; font-family:var(--font-sans); font-size:12px; color:var(--ink-primary); border-radius:2px;" onchange="handleSortChange(this.value)">
              <option value="code">Product Code (Ascending)</option>
              <option value="code_desc">Product Code (Descending)</option>
              <option value="name">Product Name (A-Z)</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Filing Index Tabs -->
      <div class="library-index-tabs" id="libraryIndexTabs"></div>

      <!-- Active Filter Strip -->
      <div class="active-filter-strip" id="activeFilterStrip" style="display:none;">
        <span class="filter-chip">
          <span id="searchFilterText"></span>
          <button onclick="clearSearch()"><i data-lucide="x" style="width:12px;height:12px;"></i></button>
        </span>
      </div>

      <!-- Card Grid -->
      <div class="archive-grid" id="cardGrid"></div>

      <!-- Virtual Pagination Controls -->
      <div class="pagination-bar" id="paginationBar">
        <div class="pagination-info" id="paginationInfo">Showing 1 - 36 of 3,381 records</div>
        <div class="pagination-buttons" id="paginationButtons"></div>
      </div>
    </main>

  </div>

  <!-- Record Detail Dossier -->
  <div class="dossier-overlay" id="dossierOverlay">
    <div class="dossier-panel" id="dossierPanel">
      <div class="dossier-header">
        <button class="btn-back-link" onclick="closeDossier()"><i data-lucide="arrow-left"></i> BACK TO COLLECTION</button>
        <div style="display:flex; gap:8px;">
          <button class="btn-dossier-nav" onclick="navDossier(-1)"><i data-lucide="chevron-left"></i> PREV</button>
          <button class="btn-dossier-nav" onclick="navDossier(1)">NEXT <i data-lucide="chevron-right"></i></button>
        </div>
      </div>
      <div class="dossier-body" id="dossierContent"></div>
    </div>
  </div>

  <script src="./chemical_data.js"></script>
  <script>
    const COLLECTIONS = [
      { id: 'ALL', label: 'ALL RECORDS', range: 'Entire Archive Index', count: 3381 },
      { id: 'D', label: 'D COLLECTION', range: 'D-001 ? D-500', count: 500 },
      { id: 'R', label: 'R COLLECTION', range: 'R-001 ? R-500', count: 500 },
      { id: 'Tc', label: 'Tc COLLECTION', range: 'Tc-001 ? Tc-1000', count: 1000 },
      { id: 'W', label: 'W COLLECTION', range: 'W-001 ? W-100', count: 100 },
      { id: 'B', label: 'B COLLECTION', range: 'B-001 ? B-100', count: 100 },
      { id: 'G', label: 'G COLLECTION', range: 'G-100 ? G-200', count: 101 },
      { id: 'Y', label: 'Y COLLECTION', range: 'Y-001 ? Y-1000', count: 1000 },
      { id: 'MISC', label: 'MISCELLANEOUS', range: 'MISC-001 ? MISC-080', count: 80 }
    ];

    let archiveRecords = window.RAW_SEED_DATA || [];
    let activeCollection = 'ALL';
    let searchQuery = '';
    let sortCriterion = 'code';
    let selectedRecordIndex = -1;

    // Virtual Pagination settings
    const PAGE_SIZE = 36;
    let currentPage = 1;

    function init() {
      if (!archiveRecords || archiveRecords.length === 0) {
        fetch('./chemical_archive_data.json')
          .then(res => res.json())
          .then(data => {
            archiveRecords = data;
            renderAll();
          })
          .catch(err => console.error('Data load fallback error:', err));
      } else {
        renderAll();
      }
      attachSearchListener();
      lucide.createIcons();
    }

    function renderAll() {
      renderCollectionSidebar();
      renderIndexTabs();
      renderLibraryRecords();
    }

    function renderCollectionSidebar() {
      document.getElementById('collectionNavList').innerHTML = COLLECTIONS.map(c => `
        <li>
          <button class="collection-btn ${activeCollection === c.id ? 'active' : ''}" onclick="selectCollection('${c.id}')">
            <div class="coll-info">
              <span class="coll-title">${c.label}</span>
              <span class="coll-range">${c.range}</span>
            </div>
            <span class="coll-count">${c.count}</span>
          </button>
        </li>
      `).join('');
    }

    function renderIndexTabs() {
      document.getElementById('libraryIndexTabs').innerHTML = COLLECTIONS.map(c => `
        <button class="index-tab-btn ${activeCollection === c.id ? 'active' : ''}" onclick="selectCollection('${c.id}')">
          [ ${c.id === 'ALL' ? 'ALL' : c.id} ]
        </button>
      `).join('');
    }

    function selectCollection(collId) {
      activeCollection = collId;
      currentPage = 1;
      renderCollectionSidebar();
      renderIndexTabs();
      renderLibraryRecords();
    }

    function getFilteredRecords() {
      const q = searchQuery.trim().toLowerCase();
      let list = archiveRecords.filter(item => {
        if (activeCollection !== 'ALL' && item.prefix !== activeCollection) return false;
        if (!q) return true;
        const fullCode = `${item.prefix}-${item.num}`.toLowerCase();
        const callCode = `${item.prefix} ? ${item.num}`.toLowerCase();
        return fullCode === q ||
               fullCode.includes(q) ||
               callCode.includes(q) ||
               (item.name && item.name.toLowerCase().includes(q)) ||
               (item.category && item.category.toLowerCase().includes(q)) ||
               (item.description && item.description.toLowerCase().includes(q)) ||
               (item.cas && item.cas.toLowerCase().includes(q)) ||
               (item.formula && item.formula.toLowerCase().includes(q));
      });

      list.sort((a, b) => {
        if (sortCriterion === 'code') return a.prefix.localeCompare(b.prefix) || parseInt(a.num) - parseInt(a.num);
        if (sortCriterion === 'code_desc') return b.prefix.localeCompare(a.prefix) || parseInt(b.num) - parseInt(a.num);
        if (sortCriterion === 'name') return a.name.localeCompare(b.name);
        if (sortCriterion === 'category') return a.category.localeCompare(b.category);
        return 0;
      });

      return list;
    }

    function renderLibraryRecords() {
      const filtered = getFilteredRecords();
      const coll = COLLECTIONS.find(c => c.id === activeCollection) || COLLECTIONS[0];
      document.getElementById('currentCollectionTitle').innerText = coll.label;
      document.getElementById('recordCountLabel').innerText = `${filtered.length} CATALOGED RECORDS AVAILABLE (TOTAL: 3,381)`;

      const filterStrip = document.getElementById('activeFilterStrip');
      if (searchQuery.trim()) {
        filterStrip.style.display = 'flex';
        document.getElementById('searchFilterText').innerText = `Search: "${searchQuery}" (${filtered.length} matches)`;
      } else {
        filterStrip.style.display = 'none';
      }

      // Calculate Virtual Pagination
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, filtered.length);
      const pageRecords = filtered.slice(startIndex, endIndex);

      // Render Pagination Info
      document.getElementById('paginationInfo').innerText = filtered.length > 0 
        ? `Showing ${startIndex + 1} - ${endIndex} of ${filtered.length} records (Page ${currentPage} of ${totalPages})`
        : `No matching records found in archive`;

      renderPaginationButtons(totalPages);

      if (pageRecords.length === 0) {
        document.getElementById('cardGrid').innerHTML = `
          <div style="grid-column: 1/-1; padding: 64px; text-align: center; border: 1px dashed var(--olive-muted); background: var(--paper-card);">
            <h3 style="font-family: var(--font-display); font-size: 20px; color: var(--ink-primary); margin-bottom: 8px;">NO RECORD FOUND</h3>
            <p style="font-family: var(--font-serif); font-style: italic; color: var(--olive-muted); font-size: 15px;">No chemical compound matches the search parameters.</p>
            <button onclick="clearSearch()" style="margin-top: 18px; background: var(--ink-primary); color: var(--paper-primary); border: none; padding: 10px 20px; font-size: 11px; font-weight:700; cursor:pointer;">RESET SEARCH</button>
          </div>
        `;
      } else {
        document.getElementById('cardGrid').innerHTML = pageRecords.map((item, idx) => `
          <div class="catalog-card" onclick="openDossierByGlobalId('${item.id}')">
            <div>
              <div class="card-top">
                <span class="card-call-number">${item.prefix} ? ${item.num}</span>
                <span class="card-archival-stamp">${item.drawer}</span>
              </div>
              <div class="card-product-name">${highlightMatch(item.name)}</div>
              <div class="card-divider"></div>
              <div class="card-meta-section">
                <div class="card-category-label">CATEGORY</div>
                <div class="card-category-value">${highlightMatch(item.category)}</div>
              </div>
              <div>
                <div class="card-desc-label">DESCRIPTION</div>
                <div class="card-desc-text">${highlightMatch(item.description)}</div>
              </div>
            </div>
            <div class="card-footer">
              <span class="card-view-link">VIEW DOSSIER ?</span>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    function renderPaginationButtons(totalPages) {
      if (totalPages <= 1) {
        document.getElementById('paginationButtons').innerHTML = '';
        return;
      }
      let btns = [];
      btns.push(`<button class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">PREV</button>`);
      
      let startP = Math.max(1, currentPage - 2);
      let endP = Math.min(totalPages, currentPage + 2);

      if (startP > 1) {
        btns.push(`<button class="btn-page" onclick="goToPage(1)">1</button>`);
        if (startP > 2) btns.push(`<span style="font-family:var(--font-mono); padding:0 4px;">...</span>`);
      }

      for (let p = startP; p <= endP; p++) {
        btns.push(`<button class="btn-page ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`);
      }

      if (endP < totalPages) {
        if (endP < totalPages - 1) btns.push(`<span style="font-family:var(--font-mono); padding:0 4px;">...</span>`);
        btns.push(`<button class="btn-page" onclick="goToPage(${totalPages})">${totalPages}</button>`);
      }

      btns.push(`<button class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">NEXT</button>`);
      document.getElementById('paginationButtons').innerHTML = btns.join('');
    }

    function goToPage(p) {
      currentPage = p;
      renderLibraryRecords();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function highlightMatch(text) {
      if (!text || !searchQuery.trim()) return text || '';
      const q = searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${q})`, 'gi');
      return text.replace(regex, '<mark style="background:var(--archival-beige-light); color:var(--ink-dark); padding:0 2px;">$1</mark>');
    }

    function handleSortChange(val) {
      sortCriterion = val;
      renderLibraryRecords();
    }

    function openDossierByGlobalId(id) {
      const idx = archiveRecords.findIndex(r => r.id === id);
      if (idx !== -1) openDossier(idx);
    }

    function openDossier(idx) {
      selectedRecordIndex = idx;
      const item = archiveRecords[idx];
      if (!item) return;

      document.getElementById('dossierContent').innerHTML = `
        <div>
          <span class="dossier-callout-code">${item.prefix} ? ${item.num}</span>
          <h2 class="dossier-product-title">${item.name}</h2>
        </div>

        <div class="chem-vector-box">
          ${item.structureSvg || ''}
          <span style="font-family:var(--font-mono); font-size:10px; color:var(--olive-muted); margin-top:8px;">2D COORDINATION / VECTOR RENDERING</span>
        </div>

        <div class="dossier-grid-meta">
          <div class="dossier-meta-item"><label>Product Category</label><span>${item.category}</span></div>
          <div class="dossier-meta-item"><label>CAS Registry Number</label><span>${item.cas}</span></div>
          <div class="dossier-meta-item"><label>Molecular Formula</label><span>${item.formula}</span></div>
          <div class="dossier-meta-item"><label>Molecular Weight</label><span>${item.mw}</span></div>
          <div class="dossier-meta-item"><label>Storage Location</label><span>${item.storage}</span></div>
          <div class="dossier-meta-item"><label>Assay Purity Standard</label><span>${item.grade}</span></div>
          <div class="dossier-meta-item"><label>Hazard Classification</label><span>${item.hazard}</span></div>
          <div class="dossier-meta-item"><label>Archived Date</label><span>${item.dateArchived}</span></div>
        </div>

        <div>
          <div style="font-family: var(--font-sans); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--olive-muted); margin-bottom: 8px;">
            DETAILED ARCHIVAL SPECIFICATION
          </div>
          <div class="dossier-desc-text">${item.description}</div>
        </div>

        <div style="border-top: 1px solid var(--border-subtle); padding-top: 20px; display: flex; gap: 12px; justify-content: flex-end; margin-top: 12px;">
          <button class="btn-cancel" onclick="window.print()"><i data-lucide="printer"></i> PRINT CALL SLIP</button>
        </div>
      `;

      document.getElementById('dossierOverlay').classList.add('open');
      lucide.createIcons();
    }

    function closeDossier() {
      document.getElementById('dossierOverlay').classList.remove('open');
    }

    function navDossier(dir) {
      const newIdx = selectedRecordIndex + dir;
      if (newIdx >= 0 && newIdx < archiveRecords.length) {
        openDossier(newIdx);
      }
    }

    function attachSearchListener() {
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        searchClearBtn.style.display = searchQuery ? 'block' : 'none';
        currentPage = 1;
        renderLibraryRecords();
      });

      searchClearBtn.addEventListener('click', clearSearch);
    }

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchClearBtn').style.display = 'none';
      currentPage = 1;
      renderLibraryRecords();
    }

    window.onload = init;
  </script>
</body>
</html>
